# ==========================================================
#  CALL CENTER - server settings
#  No spaces around the "=" sign.
# ==========================================================

# Your domain. Leave it EMPTY to serve over plain HTTP only.
# With a domain set, Caddy fetches a free HTTPS certificate
# by itself - the domain must point at this server's IP first.
DOMAIN=

# Port used when no domain is set.
PORT=80

# Optional: address for expiry warnings from the CA.
EMAIL=
